[phases.setup]
nixPkgs = ["nodejs_20"]

[variables]
COREPACK_INTEGRITY_KEYS = "0"

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@11.13.0 --activate",
  "pnpm install --frozen-lockfile --ignore-scripts"
]

[phases.build]
cmds = [
  "pnpm --filter @leanstart/api-gateway build"
]
