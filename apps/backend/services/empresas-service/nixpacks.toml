[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "npm install -g pnpm@11.13.0",
  "pnpm install --frozen-lockfile --ignore-scripts"
]

[phases.build]
cmds = [
  "pnpm --filter @leanstart/backend-commons build",
  "pnpm --filter @leanstart/empresas-service exec prisma generate",
  "pnpm --filter @leanstart/empresas-service build"
]
