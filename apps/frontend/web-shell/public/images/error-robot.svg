<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 460" fill="none">
  <defs>
    <linearGradient id="body" x1="150" y1="240" x2="310" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#AE6CFD"/>
      <stop offset="1" stop-color="#8E58EE"/>
    </linearGradient>
    <linearGradient id="head" x1="150" y1="120" x2="310" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A66BFB"/>
      <stop offset="1" stop-color="#8E58EE"/>
    </linearGradient>
    <linearGradient id="screen" x1="170" y1="150" x2="290" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2B2140"/>
      <stop offset="1" stop-color="#1C1530"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9A62FA" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9A62FA" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Halo / backdrop -->
  <circle cx="230" cy="228" r="205" fill="url(#glow)"/>
  <circle cx="230" cy="220" r="150" fill="#9A62FA" opacity="0.07"/>

  <!-- Floating grid-motif squares (marca) -->
  <rect x="70"  y="120" width="26" height="26" rx="7" fill="#9A62FA" opacity="0.20"/>
  <rect x="96"  y="150" width="18" height="18" rx="5" fill="#C687F5" opacity="0.30"/>
  <rect x="360" y="96"  width="30" height="30" rx="8" fill="#9A62FA" opacity="0.18"/>
  <rect x="384" y="150" width="16" height="16" rx="5" fill="#AE6CFD" opacity="0.35"/>
  <circle cx="86"  cy="300" r="7" fill="#C687F5" opacity="0.5"/>
  <circle cx="392" cy="292" r="9" fill="#9A62FA" opacity="0.35"/>

  <!-- Sparks (indican "algo pasó") -->
  <path d="M132 92 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" fill="#C687F5" opacity="0.85"/>
  <path d="M344 320 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3 z" fill="#AE6CFD" opacity="0.8"/>

  <!-- Ground shadow -->
  <ellipse cx="230" cy="404" rx="118" ry="20" fill="#9A62FA" opacity="0.12"/>

  <!-- Antenna -->
  <line x1="230" y1="118" x2="230" y2="86" stroke="#8E58EE" stroke-width="7" stroke-linecap="round"/>
  <circle cx="230" cy="78" r="12" fill="#C687F5"/>
  <circle cx="230" cy="78" r="20" stroke="#C687F5" stroke-width="3" opacity="0.4"/>

  <!-- Arms -->
  <rect x="120" y="262" width="34" height="86" rx="17" fill="url(#body)" transform="rotate(14 137 305)"/>
  <rect x="306" y="248" width="34" height="80" rx="17" fill="url(#body)" transform="rotate(-24 323 288)"/>
  <circle cx="126" cy="352" r="16" fill="#8E58EE"/>
  <circle cx="342" cy="238" r="16" fill="#8E58EE"/>

  <!-- Body -->
  <rect x="163" y="246" width="134" height="118" rx="30" fill="url(#body)"/>
  <!-- Chest panel with grid motif -->
  <rect x="192" y="280" width="76" height="56" rx="14" fill="#1C1530" opacity="0.35"/>
  <rect x="203" y="290" width="18" height="16" rx="4" fill="#C687F5" opacity="0.9"/>
  <rect x="225" y="290" width="30" height="16" rx="4" fill="#E9DDFB" opacity="0.85"/>
  <rect x="203" y="310" width="30" height="16" rx="4" fill="#E9DDFB" opacity="0.7"/>
  <rect x="237" y="310" width="18" height="16" rx="4" fill="#AE6CFD" opacity="0.9"/>

  <!-- Feet -->
  <rect x="182" y="356" width="38" height="26" rx="12" fill="#8E58EE"/>
  <rect x="240" y="356" width="38" height="26" rx="12" fill="#8E58EE"/>

  <!-- Neck -->
  <rect x="214" y="228" width="32" height="22" rx="8" fill="#8E58EE"/>

  <!-- Head -->
  <rect x="150" y="120" width="160" height="120" rx="34" fill="url(#head)"/>
  <!-- Side knobs (ears) -->
  <rect x="138" y="158" width="16" height="44" rx="8" fill="#8E58EE"/>
  <rect x="306" y="158" width="16" height="44" rx="8" fill="#8E58EE"/>

  <!-- Screen face -->
  <rect x="170" y="150" width="120" height="72" rx="22" fill="url(#screen)"/>
  <!-- Eyes (expresión "oops") -->
  <circle cx="202" cy="184" r="11" fill="#F1ECFB"/>
  <circle cx="258" cy="184" r="11" fill="#F1ECFB"/>
  <circle cx="204" cy="186" r="4.5" fill="#2B2140"/>
  <circle cx="260" cy="186" r="4.5" fill="#2B2140"/>
  <!-- Cheeks -->
  <circle cx="188" cy="200" r="7" fill="#C687F5" opacity="0.55"/>
  <circle cx="272" cy="200" r="7" fill="#C687F5" opacity="0.55"/>
  <!-- Mouth (o) -->
  <circle cx="230" cy="206" r="5" fill="#C687F5"/>
</svg>
