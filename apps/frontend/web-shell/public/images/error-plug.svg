  </defs>

  <circle cx="230" cy="228" r="205" fill="url(#pglow)"/>
  <circle cx="230" cy="220" r="150" fill="#9A62FA" opacity="0.07"/>

  <rect x="66"  y="110" width="26" height="26" rx="7" fill="#9A62FA" opacity="0.20"/>
  <rect x="92"  y="140" width="18" height="18" rx="5" fill="#C687F5" opacity="0.30"/>
  <rect x="360" y="96"  width="30" height="30" rx="8" fill="#9A62FA" opacity="0.18"/>
  <rect x="384" y="150" width="16" height="16" rx="5" fill="#AE6CFD" opacity="0.35"/>
  <circle cx="80"  cy="300" r="7" fill="#C687F5" opacity="0.5"/>
  <circle cx="392" cy="300" r="9" fill="#9A62FA" opacity="0.35"/>

